<!DOCTYPE html>
<html lang="fi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Esimiehen raportit</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <header>
        <h1>Esimiehen näkymä</h1>
        <p>Kirjaudu ulos <button id="logoutButton">tästä</button></p>
    </header>

    <main>
        <h2>Perehdytysten tila</h2>
        
        <div style="margin-bottom: 15px; padding: 10px; background-color: #e9ecef; border-radius: 4px; display: inline-block;">
            <input type="checkbox" id="showEndedContracts" style="width: auto; margin-right: 8px; transform: scale(1.2);">
            <label for="showEndedContracts" style="font-weight: bold; cursor: pointer;">Näytä myös päättyneet työsuhteet (max 2v vanhat)</label>
        </div>

        <div id="report-container">
            <p>Ladataan raportteja...</p>
        </div>

        <section class="module" style="margin-top: 30px; border-top: 2px solid #eee; padding-top: 20px;">
            <h3>Lataa jaettuja dokumentteja</h3>
            <p>Valitse PDF-tiedosto (esim. yleisperehdytys.pdf). Se ilmestyy työntekijöiden etusivulle.</p>
            
            <input type="file" id="fileUploadInput" accept=".pdf,.doc,.docx,.jpg,.png">
            <button id="fileUploadButton" style="width: auto; margin-top: 10px;">Lataa tiedosto</button>
            
            <p id="uploadStatus" style="font-weight: bold; margin-top: 10px;"></p>
        </section>
    </main>

    <div id="detailModal" class="modal">
        <div class="modal-content">
            <span class="close-btn">&times;</span>
            <h2 id="modalTitle">Työntekijän perehdytys</h2>
            <div id="modalBody"></div>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-storage-compat.js"></script>
    
    <script src="js/firebase-config.js"></script>
    <script>
        firebase.initializeApp(firebaseConfig);
    </script>
    <script src="js/manager-logic.js"></script>

</body>
</html>

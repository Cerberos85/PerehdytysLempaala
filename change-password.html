<!DOCTYPE html>
<html lang="fi">
<head>
    <meta charset="UTF-8">
    <title>Vaihda salasana</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="login-container">
        <h2>Tervetuloa!</h2>
        <p>Tietoturvasyistä sinun on vaihdettava väliaikainen salasanasi ennen jatkamista.</p>
        
        <input type="password" id="new-password" placeholder="Uusi salasana (väh. 6 merkkiä)">
        <input type="password" id="confirm-password" placeholder="Vahvista uusi salasana">
        
        <button id="changePasswordBtn">Vaihda salasana ja jatka</button>
        <p id="message" style="color:red;"></p>
    </div>

    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-firestore-compat.js"></script>
    <script src="js/firebase-config.js"></script>
    
    <script>
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();

        document.getElementById('changePasswordBtn').addEventListener('click', async () => {
            const newPass = document.getElementById('new-password').value;
            const confirmPass = document.getElementById('confirm-password').value;
            const msg = document.getElementById('message');

            if (newPass.length < 6) {
                msg.textContent = "Salasanan on oltava vähintään 6 merkkiä pitkä.";
                return;
            }
            if (newPass !== confirmPass) {
                msg.textContent = "Salasanat eivät täsmää!";
                return;
            }

            const user = auth.currentUser;
            if (user) {
                try {
                    // 1. Vaihdetaan salasana Auth-palvelimeen
                    await user.updatePassword(newPass);
                    
                    // 2. Poistetaan pakotus Firestoresta
                    await db.collection('userProgress').doc(user.uid).update({
                        requiresPasswordChange: false
                    });

                    msg.style.color = "green";
                    msg.textContent = "Salasana vaihdettu onnistuneesti! Ohjataan...";

                    // 3. Tarkistetaan mihin ohjataan (esimies vai työntekijä)
                    const token = await user.getIdTokenResult();
                    setTimeout(() => {
                        if (token.claims.manager) {
                            window.location.href = 'manager.html';
                        } else {
                            window.location.href = 'app.html';
                        }
                    }, 1500);

                } catch (error) {
                    console.error(error);
                    msg.textContent = "Virhe salasanan vaihdossa. Kirjaudu ulos ja yritä uudelleen.";
                }
            } else {
                msg.textContent = "Istunto on vanhentunut. Kirjaudu uudelleen sisään.";
            }
        });
    </script>
</body>
</html>
